name: probe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: 72ff278a-9e71-43ec-bac4-2ca303f8e462
      AZURE_TENANT_ID: 3205c325-06a5-4171-9ce8-ffc5e6c2845e
      AZURE_SUBSCRIPTION_ID: c5e4e004-b42d-4ac4-a502-5fd338380eb6
    steps:
      - name: Exchange
        run: |
          set -u
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "jwt_len=${#JWT}"
          echo "$JWT" | cut -d. -f2 | python3 -c '
          import sys,base64,json
          raw=sys.stdin.read().strip().replace("-","+").replace("_","/")
          raw+="="*((4-len(raw)%4)%4)
          d=json.loads(base64.b64decode(raw))
          print("sub =",d.get("sub"))'
          RESP=$(curl -sS -X POST "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d "scope=https://management.azure.com/.default" \
            -d "grant_type=client_credentials" \
            -d "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion=${JWT}")
          echo "$RESP" | python3 -c '
          import sys,json
          try:
            d=json.loads(sys.stdin.read())
            if "access_token" in d:
              print("OK tok_len=",len(d["access_token"]),"exp=",d.get("expires_in"))
            else:
              print("ERR",d.get("error"))
              print("DESC",d.get("error_description",""))
          except Exception as e:
            print("parse",e)'
